<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121214">
<meta name="color-scheme" content="dark">
<title>Fares Mahmoud | Digital Business Card</title>
<meta name="description" content="Fares Mahmoud, Web Developer. Connect on LinkedIn, Instagram, Facebook or WhatsApp.">
<style>
  :root {
    --bg: #121214;
    --button: #1c1c1e;
    --button-hover: #232326;
    --border: #2c2c2e;
    --border-hover: #3a3a3c;
    --button-active: #2a2a2d;
    --white: #ffffff;
    --muted: #8e8e93;
    --radius: 14px;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
    background: var(--bg);
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding:
      max(28px, env(safe-area-inset-top))
      max(20px, env(safe-area-inset-right))
      max(28px, env(safe-area-inset-bottom))
      max(20px, env(safe-area-inset-left));
    background: var(--bg);
    color: var(--white);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.4;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  /* Profile sits at the top, links are anchored to the bottom of the screen */
  .card {
    flex: 1;
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Profile ---------- */
  .profile {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 0 36px;
    text-align: center;
  }

  /* Two rings pulse outward, like an NFC tap signal */
  .avatar-wrap {
    position: relative;
    width: 120px;
    height: 120px;
    margin-bottom: 22px;
  }
  .avatar-wrap::before,
  .avatar-wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid var(--muted);
    opacity: 0;
    animation: nfc-pulse 3.6s ease-out infinite;
  }
  .avatar-wrap::after { animation-delay: 1.8s; }

  @keyframes nfc-pulse {
    from { transform: scale(1);    opacity: 0.45; }
    to   { transform: scale(1.55); opacity: 0; }
  }

  .avatar {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: linear-gradient(145deg, #2c2c2e, #1c1c1e);
    border: 2px solid var(--border);
    color: var(--white);
    font-size: 38px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  h1 {
    margin: 0;
    color: var(--white);
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .title {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 15px;
  }

  /* ---------- Links ---------- */
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* One style for every link button, WhatsApp included */
  .link {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 64px;
    padding: 12px 16px;
    border-radius: var(--radius);
    background: var(--button);
    border: 1px solid var(--border);
    color: var(--white);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.2s ease;
  }

  .link-icon {
    width: 40px;
    height: 40px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--white);
  }
  .link-icon svg { width: 20px; height: 20px; }

  .link-text { display: flex; flex-direction: column; min-width: 0; }
  .link-name { font-size: 16px; font-weight: 600; color: var(--white); }
  .link-hint { color: var(--muted); font-size: 13px; }


  /* ---------- Entry animation ---------- */
  /* Profile rises first, then each button follows 70ms apart. Total is about 0.6s.
     "backwards" (not "both") lets the :hover and :active transforms work after it ends. */
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .profile,
  .link {
    animation: rise 0.35s ease-out backwards;
    animation-delay: calc(var(--i, 0) * 70ms);
  }

  /* ---------- States ---------- */
  @media (hover: hover) {
    .link:hover { background: var(--button-hover); border-color: var(--border-hover); transform: scale(1.01); }
  }
  .link:active {
    transform: scale(0.98);
    background: var(--button-active);
    border-color: var(--border-hover);
  }

  a:focus-visible {
    outline: 2px solid var(--white);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .avatar-wrap::before,
    .avatar-wrap::after { animation: none; }
    .profile, .link { animation: none; }
    .link { transition: none; }
  }

  @media (max-width: 360px) {
    h1 { font-size: 25px; }
    .avatar-wrap { width: 104px; height: 104px; }
    .avatar { font-size: 33px; }
  }
</style>
</head>
